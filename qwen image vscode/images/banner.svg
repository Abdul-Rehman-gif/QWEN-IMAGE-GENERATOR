<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" rx="16" fill="url(#bg)"/>

  <!-- abstract "image generation" motif: overlapping shapes forming a picture frame -->
  <g transform="translate(60,45)">
    <rect x="0" y="0" width="130" height="130" rx="10" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="35" cy="40" r="14" fill="#fbbf24"/>
    <path d="M10 110 L50 70 L75 95 L100 60 L120 110 Z" fill="#818cf8" opacity="0.85"/>
  </g>

  <text x="230" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">
    Qwen-Image Local Runner
  </text>
  <text x="230" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#c7d2fe">
    Generate images locally in VS Code — install, download, and run, hands-off.
  </text>

  <g transform="translate(230,150)">
    <rect x="0" y="0" width="118" height="28" rx="14" fill="#312e81"/>
    <text x="59" y="19" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e0e7ff" text-anchor="middle">100% Local</text>
  </g>
  <g transform="translate(360,150)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#312e81"/>
    <text x="70" y="19" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e0e7ff" text-anchor="middle">Open Source Model</text>
  </g>
  <g transform="translate(512,150)">
    <rect x="0" y="0" width="150" height="28" rx="14" fill="#312e81"/>
    <text x="75" y="19" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e0e7ff" text-anchor="middle">CPU or GPU</text>
  </g>
</svg>
